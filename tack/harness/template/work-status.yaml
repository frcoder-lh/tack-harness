# ============================================================
# 工作区状态文件（$work/status.yaml，新建工作区时由 harness/template 模板复制 + sed 替换）
#
# 定位：工作区属性 + 日志 + 待办。
#   AI 当前在处理哪个任务、处理到什么程度、下一步做什么，都记在这里；
#   这是工作区下唯一有状态的文件，AI 在执行每个任务前后都应更新；
#   内容尽量简洁，细节放在 plan.md。
#
# 状态枚举：status 的合法取值由 harness/workflow/ 下所属工作流的「状态流转」定义。
# ============================================================

# 工作 ID（默认与分支同名）
work_id: "{{BRANCH}}"
# 工作区目录名（$root/space/ 下的目录 = 创建日期 YYYYMMDD + 分支名，便于按时间排序；与 branch 解耦）
work_dir: "{{WORK_DIR}}"
# 工作状态（取值见 harness/workflow/ 所属工作流）
status: "initialized"
# 所属工作流（development / testing / bugfix / merge-conflict / branch-op，或项目自定义工作流）
workflow: "development"
# 工作分支（git 分支名，不带日期前缀）
branch: "{{BRANCH}}"
# 本工作区涉及的服务/仓库
services: []
# MR / PR 地址（push 或平台合并后回填）
mr_url: ""
# 需求/工作项地址（如 Meego）
meego: ""
# 技术文档外链（如飞书）
tech_doc_url: ""

created_at: "{{CREATED_AT}}"
updated_at: "{{CREATED_AT}}"

# 当前进展（日志 + 待办；细节放 plan.md，不要堆在这里）
current:
  stage: ""          # 当前环节：ask / spec / plan / tech-design / code / fix / testcode / test / run / review / merge
                     # branch-op 工作流：prepare / integrate / resolve / push / cleanup
                     # bugfix 工作流：reproduce / diagnose / fix / verify；merge-conflict 工作流：fetch / merge / resolve / push
  task: ""           # 当前正在处理的任务 ID 与标题（对应下方 tasks 列表）
  next: ""           # 下一步该做什么

# 阶段进度（主链路环节每完成一个置 true，命令执行前后同步更新）
progress:
  ask: false          # 代码理解产物（分析文档/问答文档）已生成
  spec: false         # spec.md 已确认
  plan: false         # plan.md（含任务清单）已确认
  tech-design: false  # tech-design.md 已确认
  code: false         # 开发已完成
  # —— 以下为按需命令的完成事实记录（非必经环节：用户主动触发并完成后置 true；不触发无需任何标记，不阻塞 commit/push/merge/close）——
  testcode: false     # 单测审查与覆盖率达标（testcode 完成）
  test: false         # 系统测试方案（test.md）已确认（test 完成）
  run: false          # run 脚本已执行（run 完成）
  release_check: false # 上线检查清单（release-check.md）已生成（release-check 完成）
  review: false       # 代码审查已通过
  merged: false       # 已合并

# 任务清单（由 plan 命令生成，code/testcode 推进状态；状态枚举：pending / in_progress / done / blocked）
# 每条结构：id / title / module / repo / deps(依赖任务) / acceptance / parallel_with(可并行任务) / status
tasks: []

# 遗留后续项（merge 审查三选一分流中选择「记录后续」时登记；不阻塞本次合并）
follow_ups: []
# 每条结构：
#   - id: "F-01"
#     issue: ""            # 问题描述
#     location: ""         # 位置（文件:行号 或模块）
#     source: "review"     # 来源：merge 审查 / 用户补充
#     severity: ""         # 严重度：critical / warning / suggestion
#     plan: ""             # 计划处理时间或承接 issue 链接
#     status: "open"       # open / done / wontdo

# 部署/泳道登记（需求在各环境的小流量与上线事实；testcode 部署验证、merge 登记上线计划时写入，close 检查回收）
# 泳道本质是「需求分支代码部署到共享环境的隔离实例 + 流量路由规则」，不新增代码分支概念；
# 环境拓扑、泳道申请方式等静态事实记在 $root/wiki/manifest.md 的「部署环境与泳道」，不在这里
deploy: []
# 每条结构：
#   - repo: ""              # 仓库名
#     env: ""               # 环境：BOE / PPE / PROD（或项目自定义环境）
#     lane: ""              # 泳道标识（建议从 work_id 派生，如 tack-<work_id>，便于与部署平台对账）
#     route: ""             # 进泳道的流量路由方式（header / cookie / uid 白名单）
#     build: ""             # 部署版本 / 镜像 tag
#     url: ""               # 访问地址（或部署平台入口链接）
#     status: "deploying"   # deploying / deployed / verified / recycled

# 分支操作信息（仅 branch-op 工作流使用，由 work 分流时写入；续跑与 close 清理以此为准）
branch_op: null
# 结构：
# branch_op:
#   op: "merge"               # merge / rebase
#   source: "feature-a"       # 源分支 A
#   target: "release-x"       # 目标分支 B
#   ts: "20260928183000"      # 时间戳（临时分支后缀）
#   repos:
#     - repo: "repo-name"
#       source_tmp: "feature-a-20260928183000"
#       target_tmp: "release-x-20260928183000"
#       working: "release-x-20260928183000"   # worktree 实际检出的工作分支
#       pushed: false
#   force_lease_authorized: false   # rebase：用户当次明确授权后置 true（脚本仍需环境变量双验证）
#   cleaned: false                  # close cleanup 完成后置 true

# 缺陷溯源信息（仅 bugfix 工作流使用；diagnosing 环节经 git-bug-trace.sh 溯源后写入）
# 帮助理解缺陷何时、由哪个需求、经哪个 commit/MR 引入，便于评估影响范围与防回归
bug_origin: null
# 结构：
# bug_origin:
#   repo: ""                    # 缺陷所在仓库名
#   file: ""                    # 缺陷所在文件（相对仓库路径）
#   line: ""                    # 缺陷行号或范围（如 42 或 42-45）
#   introduced_commit: ""       # 引入缺陷的 commit hash
#   introduced_commit_url: ""   # commit 链接（由 remote 推导）
#   introduced_at: ""           # 引入时间（ISO 8601）
#   introduced_by: ""           # 引入者
#   requirement: ""             # 对应需求/工单 ID（如 #123 MEEGO-456，从 commit message 提取）
#   merge_commit: ""            # 把该 commit 带入主干的合并提交 hash
#   merge_subject: ""           # 合并提交标题（通常含 MR/PR 编号）
#   merge_url: ""               # 合并到主干的 MR/PR 链接
#   target_branch: ""           # 溯源时目标主干分支（master/main）
#   note: ""                    # 溯源说明（如未找到合并提交的原因）

# 用户引导记录（harness 自进化的原始素材，AGENTS.md 核心约束第 11 条）
# 采集时机：每个任务/环节结束时，凡用户对 AI 的做法有过引导、纠偏、补充约定，自动追加一条（无需用户要求）
# 固化时机：close 工作区时自动触发、或手动执行 evolution/record——将可复用的操作习惯固化到
#           workflow/cmd/rule（能融合则融合，经用户确认后落盘），随后将该条 status 置 distilled
# 边界：只记事实，不直接改动 harness；一次性过程信息也先采集，由固化环节按 record-classification 判据筛选
guidance: []
# 每条结构：
#   - id: "G-01"              # 本工作区内顺序编号
#     at: ""                  # 记录时间（ISO 8601）
#     stage: ""               # 发生环节：ask / spec / plan / tech-design / code / fix / testcode / review / merge
#     task: ""                # 关联任务 ID（无则留空）
#     situation: ""           # 场景：当时 AI 原本怎么做 / 遇到什么情况
#     guidance: ""            # 用户的引导、纠偏或补充约定（原话事实，不演绎）
#     candidate: ""           # 建议固化点：落到哪个 workflow/cmd/rule、如何改
#     status: "raw"           # raw 待固化 / distilled 已固化（须补落点行）/ dismissed 评估后不固化
#     落点: ""                 # 仅 distilled 时填写：相对 $root 的路径（如 harness/cmd/dev/code.md），
#                             # 多落点空格分隔；close/evolution 后由 check-guidance.sh 校验文件存在
