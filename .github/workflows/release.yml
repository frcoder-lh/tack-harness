name: Release

on:
  push:
    tags:
      - 'V*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Package
        run: |
          mkdir -p dist
          zip -r dist/tack-harness-${{ steps.version.outputs.version }}.zip . \
            -x '.git/*' \
            -x '.github/*' \
            -x 'dist/*' \
            -x '.gitattributes' \
            -x '.gitignore'

      - name: Extract changelog section
        run: |
          [ -f CHANGELOG.md ] || touch CHANGELOG.md
          TAG="${GITHUB_REF_NAME}"
          awk -v tag="$TAG" '(index($0, "## " tag " ") == 1 || $0 == "## " tag) {f=1; next} f && /^## / {exit} f {print}' CHANGELOG.md > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Tack Harness ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: dist/tack-harness-*.zip
          generate_release_notes: true
