name: Release

on:
  push:
    tags:
      - 'V*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          zip -r "dist/tack-harness-${VERSION}.zip" . \
            -x '.git/*' \
            -x '.github/*' \
            -x 'dist/*' \
            -x '.gitattributes' \
            -x '.gitignore'
          # 安装脚本按 releases/download/<tag>/tack-harness-<tag>.tar.gz 下载并核验
          # 同名 .sha256；包内保留单层 tack-harness-<tag>/ 目录，解压路径与分支归档一致
          git archive --format=tar.gz \
            --prefix="tack-harness-${VERSION}/" \
            -o "dist/tack-harness-${VERSION}.tar.gz" HEAD
          (cd dist && sha256sum "tack-harness-${VERSION}.tar.gz" > "tack-harness-${VERSION}.tar.gz.sha256")

      - name: Extract changelog section
        shell: bash
        run: |
          # 双语 Release body：中英两份 CHANGELOG 同版本段落均须存在（release.sh 已在发版前校验），
          # 分别抽取后拼接，任一为空即中止，避免发布只有单语的 Release 说明
          [ -f CHANGELOG.md ] || { echo "CHANGELOG.md missing" >&2; exit 1; }
          [ -f CHANGELOG.en.md ] || { echo "CHANGELOG.en.md missing" >&2; exit 1; }
          TAG="${GITHUB_REF_NAME}"
          extract() {
            awk -v tag="$TAG" '(index($0, "## " tag " ") == 1 || $0 == "## " tag) {f=1; next} f && /^## / {exit} f {print}' "$1"
          }
          zh="$(extract CHANGELOG.md)"
          en="$(extract CHANGELOG.en.md)"
          [ -n "$zh" ] || { echo "Chinese changelog section for $TAG is empty" >&2; exit 1; }
          [ -n "$en" ] || { echo "English changelog section for $TAG is empty" >&2; exit 1; }
          {
            echo "## 中文"
            echo
            echo "$zh"
            echo
            echo "## English"
            echo
            echo "$en"
          } > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Tack Harness ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/tack-harness-*.zip
            dist/tack-harness-*.tar.gz
            dist/tack-harness-*.tar.gz.sha256
          generate_release_notes: true
