name: Release

on:
  push:
    tags:
      - 'V*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Package
        run: |
          mkdir -p dist
          zip -r dist/tack-harness-${{ steps.version.outputs.version }}.zip . \
            -x '.git/*' \
            -x '.github/*' \
            -x 'dist/*' \
            -x '.gitattributes' \
            -x '.gitignore'

      - name: Extract changelog section
        shell: bash
        run: |
          # 双语 Release body：中英两份 CHANGELOG 同版本段落均须存在（release.sh 已在发版前校验），
          # 分别抽取后拼接，任一为空即中止，避免发布只有单语的 Release 说明
          [ -f CHANGELOG.md ] || { echo "CHANGELOG.md missing" >&2; exit 1; }
          [ -f CHANGELOG.en.md ] || { echo "CHANGELOG.en.md missing" >&2; exit 1; }
          TAG="${GITHUB_REF_NAME}"
          extract() {
            awk -v tag="$TAG" '(index($0, "## " tag " ") == 1 || $0 == "## " tag) {f=1; next} f && /^## / {exit} f {print}' "$1"
          }
          zh="$(extract CHANGELOG.md)"
          en="$(extract CHANGELOG.en.md)"
          [ -n "$zh" ] || { echo "Chinese changelog section for $TAG is empty" >&2; exit 1; }
          [ -n "$en" ] || { echo "English changelog section for $TAG is empty" >&2; exit 1; }
          {
            echo "## 中文"
            echo
            echo "$zh"
            echo
            echo "## English"
            echo
            echo "$en"
          } > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Tack Harness ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: dist/tack-harness-*.zip
          generate_release_notes: true
