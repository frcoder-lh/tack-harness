name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Shell syntax (sh -n)
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 sh -n

      - name: Harness structure lint
        run: sh tack/harness/script/lint-harness.sh tack/harness

      - name: Shell portability lint
        run: sh tack/harness/script/lint-shell-portability.sh tack/harness

      - name: Doc script signature lint
        run: sh tack/harness/script/lint-doc-scripts.sh tack/harness

      - name: Command regression tests
        run: sh .github/tests/run.sh --report "$RUNNER_TEMP/command-regression.xml"

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-regression-${{ matrix.os }}
          path: ${{ runner.temp }}/command-regression.xml
          if-no-files-found: warn
          retention-days: 14
