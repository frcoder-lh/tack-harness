name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax (sh -n)
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 sh -n

      - name: Harness structure lint
        run: sh tack/harness/script/lint-harness.sh tack/harness

      - name: Shell portability lint
        run: sh tack/harness/script/lint-shell-portability.sh tack/harness

      - name: Doc script signature lint
        run: sh tack/harness/script/lint-doc-scripts.sh tack/harness
